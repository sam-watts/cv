# Rebuilds sam-watts-cv.pdf whenever the CV content or styling changes,
# and commits it back so the PDF link on the site stays in sync.
name: Build PDF

on:
  push:
    branches: [gh-pages]
    paths:
      - _config.yml
      - _data/**
      - _includes/**
      - _layouts/**
      - _sass/**
      - css/**
      - images/**
      - index.html
      - _scripts/build-pdf.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build PDF
        env:
          CHROME: google-chrome
          CHROME_FLAGS: --no-sandbox
        run: ./_scripts/build-pdf.sh

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sam-watts-cv.pdf
          git diff --cached --quiet && { echo "PDF unchanged"; exit 0; }
          git commit -m "Rebuild PDF"
          git pull --rebase
          git push
