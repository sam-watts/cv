# Site settings
title: "Sam Watts - CV"
description: ""
url: "https://swatts.xyz"
baseurl: "/cv"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Sam Watts"
resume_title:                   "Machine Learning Engineer 🧪"

display_header_contact_info:    "false"

resume_header_intro: >
  <p>
  I'm a data professional with a wide range of experience in different types of modelling and software engineering practices. 
  I originally specialised in recommender systems, but more recently I have followed my interest in other topics, including: geospatial data, computer vision, and agentic systems.
  <br>
  <br>
  I'm driven by a desire to learn, solve important problems, and be helpful. I'm most interested in roles in climate tech and health; and I'm open to other roles that are socially useful.
  <br>
  <br>
  I'm currently based in Edinburgh, Scotland 🏴󠁧󠁢󠁳󠁣󠁴󠁿 I'm currently looking for roles in Edinburgh, remote roles, or hybrid roles in the UK with occasional travel.
  </p>

